server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    large_client_header_buffers 8 64k;
    client_header_buffer_size 64k;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service Worker script: must revalidate when online, but serve offline if disconnected
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires 0;
        try_files $uri =404;
    }

    # Web manifest and app metadata
    location ~* \.(?:webmanifest|json)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Static assets (JS, CSS, images, fonts): explicit 404 fallback instead of falling back to index.html
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}