name: Automated Release & Semantic Tagging

on:
  push:
    branches:
      # Releases are cut from the production deploy branch (what the server
      # checks out), so every tag carries the server-placement config.
      - deployed-20260716-1247
      - deploy-test

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please (Conventional Commits -> SemVer Tag)
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
