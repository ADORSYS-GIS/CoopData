name: Automated Release & Semantic Tagging

on:
  push:
    branches:
      # Releases are cut from the production deploy branch (what the server
      # checks out), so every tag carries the server-placement config.
      - deployed-20260716-1247
      - deploy-test

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    name: Release Please (Conventional Commits -> SemVer Tag)
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      # Tags/releases created with GITHUB_TOKEN do not trigger other workflows,
      # so the release event never reaches docker.yml. workflow_dispatch is the
      # one trigger GITHUB_TOKEN is allowed to fire.
      - name: Deploy the new release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref "$REF_NAME" -f target_tag="$TAG_NAME"
