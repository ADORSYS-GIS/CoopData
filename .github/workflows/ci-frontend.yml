name: Frontend CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  frontend_install:
    name: Frontend Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      # Save only: restoring here would copy an older node_modules over the fresh
      # install whenever the lockfile changes, and save that mix for every job.
      - name: Cache node modules
        uses: actions/cache/save@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('frontend/package-lock.json') }}

  frontend_lint:
    name: Frontend Lint
    needs: [frontend_install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cached node modules
        uses: actions/cache/restore@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('frontend/package-lock.json') }}
          fail-on-cache-miss: true

      - name: ESLint
        working-directory: ./frontend
        run: npm run lint

  frontend_prettier:
    name: Frontend Prettier
    needs: [frontend_install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cached node modules
        uses: actions/cache/restore@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('frontend/package-lock.json') }}
          fail-on-cache-miss: true

      - name: Prettier
        working-directory: ./frontend
        run: npm run prettier:check

  frontend_typescript:
    name: Frontend TypeScript
    needs: [frontend_install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cached node modules
        uses: actions/cache/restore@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('frontend/package-lock.json') }}
          fail-on-cache-miss: true

      - name: Generate OpenAPI client
        working-directory: ./frontend
        run: npm run codegen

      - name: TypeScript
        working-directory: ./frontend
        run: npx tsc --noEmit

  frontend_unit_tests:
    name: Frontend Unit Tests
    needs: [frontend_install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cached node modules
        uses: actions/cache/restore@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('frontend/package-lock.json') }}
          fail-on-cache-miss: true

      - name: Unit tests with coverage
        working-directory: ./frontend
        run: npm run coverage -- --reporter=verbose

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 30

  frontend_build:
    name: Frontend Build
    needs: [frontend_install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cached node modules
        uses: actions/cache/restore@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('frontend/package-lock.json') }}
          fail-on-cache-miss: true

      - name: Generate OpenAPI client
        working-directory: ./frontend
        run: npm run codegen

      - name: Build
        working-directory: ./frontend
        run: npm run build

  frontend_e2e_tests:
    name: Frontend E2E Tests
    needs: [frontend_install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cached node modules
        uses: actions/cache/restore@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('frontend/package-lock.json') }}
          fail-on-cache-miss: true

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: ./frontend
        run: npm run test:e2e
        env:
          CI: "true"