name: Backend CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  backend_setup:
    name: Backend Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-backend-
          cache-on-failure: true

  backend_lint:
    name: Backend Lint
    needs: [backend_setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: Format check
        working-directory: ./backend
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: ./backend
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  backend_build:
    name: Backend Build
    needs: [backend_setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: Build
        working-directory: ./backend
        run: cargo build --workspace --all-targets --all-features

  backend_test:
    name: Backend Test
    needs: [backend_setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run tests with coverage
        working-directory: ./backend
        run: >
          cargo tarpaulin
          --workspace
          --all-features
          --out Xml
          --output-dir ./coverage
          --skip-clean
          --ignore-tests
          --timeout 120
          --exclude-files "src/main.rs"
          --exclude-files "src/bin/*"
          --exclude-files "src/entities/*"
          --exclude-files "src/api/dto/*"
          --exclude-files "src/api/routes/*"
          --exclude-files "src/api/openapi.rs"
          --exclude-files "src/api/swagger_html.rs"
          --exclude-files "src/config.rs"
          --exclude-files "migrations/*"
          --exclude-files "src/services/report_narrative.rs"
          --exclude-files "src/services/extraction_pipeline.rs"
          --exclude-files "src/services/ai_extraction.rs"
          --exclude-files "src/services/export_generator.rs"
          --exclude-files "src/services/nf_excel_parser.rs"
          --fail-under 25

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/cobertura.xml
          retention-days: 30


  backend_docs:
    name: Backend Docs
    needs: [backend_setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: Generate docs
        working-directory: ./backend
        run: cargo doc --workspace --all-features --no-deps