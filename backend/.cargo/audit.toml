# WARNING: this file is OVERWRITTEN by the CI security workflow
# (copied from backend/audit.toml). Edit backend/audit.toml instead.
[advisories]
ignore = [
  "RUSTSEC-2023-0071", # Marvin Attack: potential key recovery in rsa (no fixed upgrade available)
  "RUSTSEC-2024-0370", # proc-macro-error is unmaintained (informational warning)
  "RUSTSEC-2026-0173", # proc-macro-error2 is unmaintained (informational warning)
  "RUSTSEC-2026-0187", # lopdf stack overflow via nested PDF objects — transitive via printpdf 0.7; fix requires printpdf upgrade to 0.11+ (breaking API changes)
  "RUSTSEC-2026-0192", # ttf-parser unmaintained — transitive via pdf_oxide; no alternative available
  "RUSTSEC-2026-0221", # event-listener !Send StackSlot — transitive via sqlx-core 0.8.6; fix requires sqlx upgrade
  "RUSTSEC-2026-0253", # lru potential use-after-free — transitive via tower-layer; fix requires tower-layer upgrade
  "RUSTSEC-2026-0235", # rkyv archive OOB read — transitive via rust_decimal 1.42.1; fix requires rkyv >= 0.8.17 (breaking)
  # zip < 9.0 extraction flaws (symlink targets, permissions through symlinks, SUID/SGID bits) — only
  # reachable through ZipArchive::extract / ZipStreamReader::extract, which write an archive to disk.
  # zip 8.6 comes only from docx-rs (0.4.22 is the latest release), which reads .docx entries in memory
  # (by_name + read_to_end); neither it nor this codebase extracts archives. Remove once docx-rs uses zip >= 9.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  # crypto-bigint < 0.7.6 / ctutils < 0.4.4 timing-variability issues — transitive
  # via aws-sigv4 1.5.1 (pinned by aws-sdk-s3 ^1) and elliptic-curve 0.13/p256 0.13
  # (JWT signature verification). Fixing requires a coordinated RustCrypto
  # ecosystem major bump (elliptic-curve 0.14, p256 0.14, newer aws-sdk); the
  # affected operations are signature verification/signing on a server workload,
  # where the practical timing-attack surface is negligible. Revisit when the
  # AWS SDK moves to crypto-bigint 0.7.
  "RUSTSEC-2026-0387",
  "RUSTSEC-2026-0385"
]
