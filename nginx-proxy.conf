worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Docker embedded DNS resolver — re-resolves backend/frontend every 5s so docker-rollout IP changes are tracked dynamically
    resolver 127.0.0.11 valid=5s ipv6=off;

    # ── Backend API proxy — exposed on host port 3000 ────────────────────────
    server {
        listen 3000;
        server_name _;

        location / {
            set $backend_target "http://backend:3000";
            proxy_pass         $backend_target;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    # ── Frontend proxy — exposed on host port 5174 ────────────────────────────
    server {
        listen 5174;
        server_name _;

        location / {
            set $frontend_target "http://frontend:80";
            proxy_pass         $frontend_target;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
