worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # ── Upstream pools ───────────────────────────────────────────────────────
    # Docker's internal DNS automatically round-robins across all running
    # instances of a service (e.g. backend-2, backend-3 during a rollout).
    upstream backend_pool {
        server backend:3000;
        keepalive 32;
    }

    upstream frontend_pool {
        server frontend:80;
        keepalive 32;
    }

    # ── Backend API proxy — exposed on host port 3000 ────────────────────────
    server {
        listen 3000;
        server_name _;

        location / {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    # ── Frontend proxy — exposed on host port 5174 ────────────────────────────
    server {
        listen 5174;
        server_name _;

        location / {
            proxy_pass         http://frontend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
