# ─────────────────────────────────────────────────────────────────────────────
# Cargo Audit Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Ignores for known vulnerabilities in transitive dependencies that cannot be
# directly updated. These are reviewed periodically and removed when fixes
# become available in upstream crates.

[advisories]
# rustls-webpki 0.101.7 — transitive dependency via aws-sdk-s3 → rustls 0.21
# These are TLS certificate validation issues that don't affect our use case
# (we use the AWS SDK for S3/MinIO on an internal network, not public TLS).
# Will be resolved when AWS SDK upgrades to rustls 0.23+.
ignore = [
    "RUSTSEC-2026-0099",  # Name constraints for wildcard certificates
    "RUSTSEC-2026-0104",  # Reachable panic in CRL parsing
    "RUSTSEC-2026-0098",  # Name constraints for URI names
]
