global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "vllm"
    static_configs:
      - targets: ["vllm:8000"]
    metrics_path: /metrics

  - job_name: "dcgm"
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
