# ─────────────────────────────────────────────────────────────────────────────
# CoopData Production — Pre-built Images from GHCR
# Enterprise-grade: healthchecks · autoheal · resource limits · log rotation
# ─────────────────────────────────────────────────────────────────────────────
# No local building. Backend + Frontend images pulled from GHCR.
# Infrastructure images pulled from Docker Hub.
# Requires: .env file (copy from .env.example)
#
# Usage:
#   docker compose -f docker-compose.ghcr.yaml up -d
#
# Zero-downtime updates (after installing docker-rollout):
#   docker rollout -f docker-compose.ghcr.yaml backend
#   docker rollout -f docker-compose.ghcr.yaml frontend
# ─────────────────────────────────────────────────────────────────────────────

# ── Global defaults ──────────────────────────────────────────────────────────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

x-restart: &default-restart
  restart: unless-stopped

services:
  # ── Autoheal — self-healing watchdog ────────────────────────────────────────
  # Monitors containers labeled autoheal=true. When a container transitions to
  # unhealthy it is restarted automatically within ~5 seconds.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: coopdata-autoheal
    <<: *default-restart
    env_file:
      - .env
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 5
      AUTOHEAL_START_PERIOD: 0
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 10
      WEBHOOK_URL: ${AUTOHEAL_WEBHOOK_URL:-${SLACK_WEBHOOK_URL:-}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
        reservations:
          cpus: "0.01"
          memory: 32M

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: coopdata-postgres
    <<: *default-restart
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: []
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    labels:
      autoheal: "true"
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: coopdata-redis
    <<: *default-restart
    ports: []
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    labels:
      autoheal: "true"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 64M

  # ── MinIO (S3-compatible storage) ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: coopdata-minio
    <<: *default-restart
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    labels:
      autoheal: "true"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.10"
          memory: 256M

  # ── Keycloak (OpenID Connect) ──────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.6
    container_name: coopdata-keycloak
    <<: *default-restart
    command: start-dev --import-realm
    env_file:
      - .env
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8180"
      KC_HOSTNAME: "${DOMAIN_NAME:-localhost}"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      COOPDATA_SUPER_ADMIN_EMAIL: ${COOPDATA_DGRV_ADMIN_EMAIL:-admin@dgrv.coop}
      COOPDATA_SUPER_ADMIN_PASSWORD: ${COOPDATA_DGRV_ADMIN_PASSWORD:-Dgrv@Admin2026!}
      COOPDATA_SUPER_ADMIN_FIRSTNAME: ${COOPDATA_DGRV_ADMIN_FIRSTNAME:-DGRV}
      COOPDATA_SUPER_ADMIN_LASTNAME: ${COOPDATA_DGRV_ADMIN_LASTNAME:-Administrator}
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ./keycloak/realm-coopdata.json:/opt/keycloak/data/import/realm-coopdata.json:ro
      - ./keycloak/themes/coopdata:/opt/keycloak/themes/coopdata:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Use Keycloak's dedicated health endpoint (requires KC_HEALTH_ENABLED=true)
      test: ["CMD-SHELL", "curl -sf http://localhost:8180/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    logging: *default-logging
    labels:
      autoheal: "true"
      autoheal.stop.timeout: "30"
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 512M

  # ── Keycloak Provisioning (one-shot: creates admin users + SMTP config) ────
  keycloak-provision:
    image: quay.io/keycloak/keycloak:26.4.6
    container_name: coopdata-keycloak-provision
    restart: "no"
    env_file:
      - .env
    environment:
      KEYCLOAK_SERVER: http://keycloak:8180
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      COOPDATA_DGRV_ADMIN_EMAIL: ${COOPDATA_DGRV_ADMIN_EMAIL:-admin@dgrv.coop}
      COOPDATA_DGRV_ADMIN_PASSWORD: ${COOPDATA_DGRV_ADMIN_PASSWORD:-Dgrv@Admin2026!}
      COOPDATA_DGRV_ADMIN_FIRSTNAME: ${COOPDATA_DGRV_ADMIN_FIRSTNAME:-DGRV}
      COOPDATA_DGRV_ADMIN_LASTNAME: ${COOPDATA_DGRV_ADMIN_LASTNAME:-Administrator}
      COOPDATA_MINISTRY_ADMIN_EMAIL: ${COOPDATA_MINISTRY_ADMIN_EMAIL:-admin@ministry.gov}
      COOPDATA_MINISTRY_ADMIN_PASSWORD: ${COOPDATA_MINISTRY_ADMIN_PASSWORD:-Ministry@Admin2026!}
      COOPDATA_MINISTRY_ADMIN_FIRSTNAME: ${COOPDATA_MINISTRY_ADMIN_FIRSTNAME:-Ministry}
      COOPDATA_MINISTRY_ADMIN_LASTNAME: ${COOPDATA_MINISTRY_ADMIN_LASTNAME:-Administrator}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_DISPLAY: ${SMTP_FROM_DISPLAY:-CoopData}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO}
      SMTP_ENVELOPE_FROM: ${SMTP_ENVELOPE_FROM}
    volumes:
      - ./keycloak/provision.sh:/opt/keycloak/data/import/provision.sh:ro
      - ./keycloak/backfill-mfa-attribute.sh:/opt/keycloak/data/import/backfill-mfa-attribute.sh:ro
    entrypoint: ["/bin/bash", "/opt/keycloak/data/import/provision.sh"]
    depends_on:
      keycloak:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 128M

  # ── Backend (Rust/Axum) — image from GHCR ─────────────────────────────────
  # NOTE: container_name intentionally omitted to allow docker-rollout scaling.
  # During a zero-downtime rollout, two backend instances run simultaneously.
  backend:
    image: ghcr.io/adorsys-gis/coopdata-backend:${BACKEND_IMAGE_TAG:-latest}
    <<: *default-restart
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_ISSUER_ALIASES: ${JWT_ISSUER_ALIASES}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      FRONTEND_URL: ${FRONTEND_URL}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      STORAGE_TYPE: ${STORAGE_TYPE:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-coopdata}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      GOTENBERG_FRONTEND_URL: ${GOTENBERG_FRONTEND_URL:-http://frontend:80}
      EXTRACTION_BACKEND: ${EXTRACTION_BACKEND:-mock}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      gotenberg:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    labels:
      autoheal: "true"
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── Frontend (React SPA + Nginx) — image from GHCR ──────────────────────
  # NOTE: container_name intentionally omitted to allow docker-rollout scaling.
  frontend:
    image: ghcr.io/adorsys-gis/coopdata-frontend:${FRONTEND_IMAGE_TAG:-latest}
    <<: *default-restart
    environment:
      NODE_ENV: production
    expose:
      - "80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    labels:
      autoheal: "true"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  # ── Internal Nginx Reverse Proxy — stable entrypoint for host nginx ───────
  # This container has a fixed container_name and fixed host ports.
  # It routes to 'backend' and 'frontend' via Docker service DNS, which
  # automatically load-balances across all instances during docker-rollout.
  nginx-proxy:
    image: nginx:1.27-alpine
    container_name: coopdata-nginx-proxy
    <<: *default-restart
    ports:
      - "127.0.0.1:3000:3000"   # backend API — host nginx proxies here
      - "127.0.0.1:5174:5174"   # frontend    — host nginx proxies here
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
        reservations:
          cpus: "0.01"
          memory: 16M

  # ── Gotenberg (PDF Generation Engine) ────────────────────────────────────
  gotenberg:
    image: gotenberg/gotenberg:7.9
    container_name: coopdata-gotenberg
    <<: *default-restart
    ports:
      - "127.0.0.1:8081:3000"
    environment:
      - CHROMIUM_DISABLE_SANDBOX=true
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging
    labels:
      autoheal: "true"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1536M
        reservations:
          cpus: "0.10"
          memory: 256M

  # ── Monitoring Stack ──────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: coopdata-prometheus
    <<: *default-restart
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.wal-compression'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G
        reservations:
          cpus: "0.05"
          memory: 256M

  grafana:
    image: grafana/grafana:11.1.0
    container_name: coopdata-grafana
    <<: *default-restart
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # WARNING: Operators MUST override GRAFANA_ADMIN_PASSWORD in .env for production deployment!
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_DOMAIN=${DOMAIN_NAME:-localhost}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - SLACK_CHANNEL=${SLACK_CHANNEL:-#alerts}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: coopdata-postgres-exporter
    <<: *default-restart
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M
        reservations:
          cpus: "0.01"
          memory: 32M

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: coopdata-redis-exporter
    <<: *default-restart
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports: []
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
        reservations:
          cpus: "0.01"
          memory: 16M

  node-exporter:
    image: prom/node-exporter:latest
    container_name: coopdata-node-exporter
    <<: *default-restart
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports: []
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
        reservations:
          cpus: "0.01"
          memory: 16M

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data: