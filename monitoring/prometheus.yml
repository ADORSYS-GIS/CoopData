# ─────────────────────────────────────────────────────────────────────────────
# CoopData Prometheus Configuration
# Scrapes metrics from the backend, Postgres exporter, Redis exporter,
# Node exporter, and MinIO every 15 seconds.
# ─────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Load alerting rules from the alerts file
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # ── CoopData Backend (Rust/Axum) ──────────────────────────────────────────
  - job_name: "backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:3000"]
        labels:
          service: "coopdata-backend"

  # ── PostgreSQL Exporter ────────────────────────────────────────────────────
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "coopdata-postgres"

  # ── Redis Exporter ─────────────────────────────────────────────────────────
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: "coopdata-redis"

  # ── Node Exporter (EC2 Host) ──────────────────────────────────────────────
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "coopdata-host"

  # ── MinIO (S3-compatible) ─────────────────────────────────────────────────
  - job_name: "minio"
    metrics_path: "/minio/v2/metrics/cluster"
    static_configs:
      - targets: ["minio:9000"]
        labels:
          service: "coopdata-minio"
