# ─────────────────────────────────────────────────────────────────────────────
# Grafana Dashboard Provisioning — Auto-load dashboards from volume
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: 1

providers:
  - name: CoopData
    orgId: 1
    folder: "CoopData"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
