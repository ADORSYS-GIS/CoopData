title = "CoopData Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Allowlist dev secrets and documentation placeholders"
regexes = [
    '''vR_NMIX8Al5SFswDBepZy_qXklvwyBC7srXzdOz8VP8''',
    '''<strong-random-secret>''',
    '''<strong-random-password>''',
    '''<strong-random-key>''',
    '''<client-secret-from-keycloak-console>''',
    '''<app-password>''',
    '''changeme-''',
    '''<random-secret>''',
    # i18n translation keys / chart-of-accounts codes flagged as false positives
    '''loansInArrears\d+_\d+''',
]
paths = [
    '''docs/''',
]